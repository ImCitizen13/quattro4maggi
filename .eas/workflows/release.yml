name: Release → TestFlight (iOS) + Firebase (Android)

on:
  workflow_dispatch: {}

jobs:
  # ==========================================================================
  # iOS → TestFlight
  # ==========================================================================
  build_ios:
    name: Build iOS (testflight_1.0.0)
    type: build
    params:
      platform: ios
      profile: testflight_1.0.0

  testflight_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: testflight_1.0.0

  # ==========================================================================
  # Android → Firebase App Distribution
  # ==========================================================================
  build_android:
    name: Build Android (android_firebase_preview)
    type: build
    params:
      platform: android
      profile: android_firebase_preview

  distribute_android:
    name: Distribute to Firebase
    needs: [build_android]
    environment: production
    steps:
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ needs.build_android.outputs.build_id }}
          extensions: [apk]
      - name: Upload to Firebase App Distribution
        # Requires EAS env vars (production environment):
        #   GOOGLE_APPLICATION_CREDENTIALS — file-type secret, service account JSON
        #   FIREBASE_ANDROID_APP_ID        — e.g. 1:1234567890:android:abc123
        #   FIREBASE_TESTER_GROUPS         — comma-separated group aliases
        run: |
          npx -y firebase-tools@latest appdistribution:distribute \
            "${{ steps.download_build.outputs.artifact_path }}" \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "EAS build ${{ needs.build_android.outputs.build_id }}"
